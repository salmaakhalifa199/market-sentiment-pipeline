x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - .:/app
    - ./spark/delta:/delta

services:

  # ── KAFKA ──────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      sleep 15
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic crypto.prices    --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.sentiment --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.news      --partitions 3 --replication-factor 1
      echo 'Topics created.'
      "

  # ── PRODUCERS ──────────────────────────────
  binance-producer:
    <<: *base
    container_name: binance-producer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "/app/producers/binance_producer.py"]

  stocktwits-producer:
    <<: *base
    container_name: stocktwits-producer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "/app/producers/stocktwits_producer.py"]

  news-producer:
    <<: *base
    container_name: news-producer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "/app/producers/news_producer.py"]

  # ── SPARK MASTER ───────────────────────────
  spark-master:
    <<: *base
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8082:8080"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

  # ── WORKER 1: for stream-prices ────────────
  spark-worker-1:
    <<: *base
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 1500m
      SPARK_WORKER_CORES: "2"
      # Label this worker for prices job
      SPARK_WORKER_OPTS: "-Dspark.worker.resource.gpu.amount=0"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8083"
      - --cores
      - "2"
      - --memory
      - "1500m"
      - spark://spark-master:7077

  # ── WORKER 2: for stream-sentiment ─────────
  spark-worker-2:
    <<: *base
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 1500m
      SPARK_WORKER_CORES: "2"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8084"
      - --cores
      - "2"
      - --memory
      - "1500m"
      - spark://spark-master:7077

  # ── STREAM PRICES ───────────────────────────
  # Uses exactly 1 core + 1g so worker-2 still has resources for sentiment
  stream-prices:
    <<: *base
    container_name: stream-prices
    hostname: stream-prices
    depends_on:
      - spark-worker-1
      - spark-worker-2
      - kafka
    ports:
      - "4040:4040"
    command:
      - /bin/bash
      - -c
      - |
        sleep 30
        echo "Starting stream-prices..."
        /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --total-executor-cores 1 \
          --executor-memory 700m \
          --driver-memory 700m \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 \
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
          --conf spark.driver.host=stream-prices \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.jars.ivy=/tmp/.ivy \
          /app/spark/stream_prices.py 2>&1

  # ── STREAM SENTIMENT ────────────────────────
  # Starts 10s after prices to avoid racing for same executor slot
  stream-sentiment:
    <<: *base
    container_name: stream-sentiment
    hostname: stream-sentiment
    depends_on:
      - spark-worker-1
      - spark-worker-2
      - kafka
    ports:
      - "4041:4040"
    command:
      - /bin/bash
      - -c
      - |
        sleep 45
        echo "Starting stream-sentiment..."
        /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --total-executor-cores 1 \
          --executor-memory 700m \
          --driver-memory 700m \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 \
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
          --conf spark.driver.host=stream-sentiment \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.jars.ivy=/tmp/.ivy \
          /app/spark/stream_sentiment.py 2>&1

  # ── DBT ────────────────────────────────────
  dbt:
    <<: *base
    container_name: dbt
    depends_on:
      - spark-master
    environment:
      DBT_PROFILES_DIR: /app/dbt
    command:
      - /bin/bash
      - -c
      - |
        pip install dbt-spark[PyHive]==1.7.0 --quiet
        sleep 60
        cd /app/dbt
        dbt deps
        dbt run --profiles-dir /app/dbt
        dbt test --profiles-dir /app/dbt
        echo "dbt complete."
        sleep infinity
