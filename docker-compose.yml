x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - .:/app
    - ./spark/delta:/delta   # bind mount: visible in VS Code

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      sleep 15
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic crypto.prices    --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.sentiment --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic market.news      --partitions 3 --replication-factor 1
      echo 'Topics created.'
      "

  # ── PRODUCERS ──────────────────────────────
  binance-producer:
    <<: *base
    container_name: binance-producer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "/app/producers/binance_producer.py"]

  stocktwits-producer:
    <<: *base
    container_name: stocktwits-producer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "/app/producers/stocktwits_producer.py"]

  news-producer:
    <<: *base
    container_name: news-producer
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "/app/producers/news_producer.py"]

  # ── SPARK ──────────────────────────────────
  spark-master:
    <<: *base
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8082:8080"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

  spark-worker:
    <<: *base
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "4"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077

  stream-prices:
    <<: *base
    container_name: stream-prices
    hostname: stream-prices
    depends_on:
      - spark-master
      - spark-worker
      - kafka
    ports:
      - "4040:4040"
    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting 30s for Spark master..."
        sleep 30
        echo "Submitting stream-prices..."
        /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 \
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
          --conf spark.driver.host=stream-prices \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.jars.ivy=/tmp/.ivy \
          /app/spark/stream_prices.py 2>&1

  stream-sentiment:
    <<: *base
    container_name: stream-sentiment
    hostname: stream-sentiment
    depends_on:
      - spark-master
      - spark-worker
      - kafka
    ports:
      - "4041:4040"
    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting 35s for Spark master..."
        sleep 35
        echo "Submitting stream-sentiment..."
        /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 \
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
          --conf spark.driver.host=stream-sentiment \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.jars.ivy=/tmp/.ivy \
          /app/spark/stream_sentiment.py 2>&1

